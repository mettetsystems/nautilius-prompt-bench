version: 1
regression_cases:
- id: fastapi-status-endpoint
  description: FastAPI weekly status summary endpoint
  requirement_card:
    task_identity:
      objective: Add FastAPI endpoint for weekly engineering status summaries.
      task_type: new feature logic
      environment: Python with FastAPI and Pydantic
      additional_constraints:
      - Keep the response within 300 words.
      - Covers blockers and owners.
      - 'Output/completion evidence: JSON with blockers, owners, and next steps'
    agent_contract:
      definition_of_done: COMPLETE only with evidence against acceptance criteria.
        Use PARTIAL, BLOCKED, or FAILED otherwise.
      change_scope: Follow a minimum-necessary change policy.
      validation_strategy: Record real test commands; never claim tests probably pass.
      completion_contract: JSON with blockers, owners, and next steps
      resource_budget: Pause after 150 API calls or 2 hours per sub-task.
      persistent_memory: Maintain .agent/PLAN.md, STATUS.md, DECISIONS.md, and ISSUES.md.
    unresolved_fields: []
  baseline_body: 'Technical Context

    -----------------

    Environment: Python with FastAPI and Pydantic


    Core Task and Scope

    -------------------

    Task type: new feature logic

    Objective: Add FastAPI endpoint for weekly engineering status summaries.


    Inputs, Outputs, and Contracts

    ------------------------------

    Output contract: JSON with blockers, owners, and next steps.


    Architectural Rules and Constraints

    -----------------------------------

    Keep the response within 300 words.

    Covers blockers and owners.


    Edge Cases and Error Strategy

    -----------------------------

    Failure handling: raise HTTPException on validation errors.


    Response Formatting

    -------------------

    Explanation level: brief rationale then code.

    '
  must_preserve:
  - weekly engineering status
  - blockers
  critical_safety: true
  safety_forbidden_patterns:
  - invent metrics
  - guaranteed outcome
