title: FastAPI user-create coding prompt
initial_request: >
  I need a long-horizon coding-agent prompt that helps an AI implement a FastAPI + Pydantic feature:
  a POST /users endpoint that validates input and returns the created user.
clarification_answers:
  - "Recommended: evidence-based COMPLETE / PARTIAL / BLOCKED / FAILED"
  - "Recommended: minimum necessary change"
edit_instructions:
  - "Add constraint: sanitize email input against injection and keep responses concise"
  - "Change output contract to TypeScript-style interface plus FastAPI handler with pytest"
expected_initial_draft_contains:
  - FastAPI
  - Pydantic
  - users
  - Task Identity
  - Definition of Done
  - unspecified
expected_after_edits_contains:
  - sanitize
  - injection
  - TypeScript
  - pytest
