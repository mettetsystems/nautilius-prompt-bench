[project]
name = "prompt-piper-api"
version = "0.1.0"
description = "Nautilius Prompting Workbench FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "nltk>=3.9",
]

[project.optional-dependencies]
lexicon = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]
setup = [
    "huggingface_hub[cli]>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prompt_piper_api", "prompt_piper"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["prompt_piper_api", "prompt_piper"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"prompt_piper_api/routes/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sqlmodel.*", "sqlalchemy.*", "sentence_transformers.*", "weasyprint.*", "nltk.*"]
ignore_missing_imports = true
